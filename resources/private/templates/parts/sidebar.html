{%if logo %}
<div id="logo" class="block">
  <img src="{{ asset(logo, 'img') }}" alt="Logo">
</div>
{% endif %}
<div id="shortcuts" class="block">
  <button id="shortcut_add_event" class="btn btn-default btn-block">
    <i class="fa fa-plus"></i> {% trans %}labels.createevent{% endtrans %}
  </button>
  </div>

  <div class="block calendar_list panel panel-default" id="own_calendar_list">
  <div class="panel-heading">
    <h3 class="panel-title">{% trans %}labels.calendars{% endtrans %}</h3>
  </div>
  <div class="panel-body">
  <ul class="fa-ul">
  </ul>
  <div class="buttons">
  <i title="{% trans %}labels.create_calendar{% endtrans %}" id="calendar_add" class="pseudobutton fa fa-plus"></i>
  </div>
  </div><!-- panel-body -->
  </div><!-- panel -->

  <div class="block calendar_list dropdown shared_calendars" id="shared_calendar_list">
    <button class="btn btn-default dropdown-toggle" type="button"
	    id="shared_calendars_expand" data-toggle="dropdown"
	    aria-haspopup="true" aria-expanded="false">
      <span class="panel-title">
	{% trans %}labels.shared_calendars{% endtrans %}
      </span>
      <span class="caret"></span>
  </button>
    <ul class="fa-ul dropdown-menu" aria=labelledby="shared_calendars_expand">
    </ul>
  <div class="buttons">
    <span id="toggle_all_shared_calendars" class="pseudobutton hide_all"
      title="{% trans %}labels.toggleallcalendars{% endtrans %}>"
    ><i class="fa fa-eye-slash fa-lg"></i></span>
  </div>
  </div><!-- panel -->

  {% if calendar_subscriptions %}
  <div class="block calendar_list dropdown subscribed_calendars " id="subscribed_calendar_list">
    <button class="btn btn-default dropdown-toggle" type="button"
	    id="subscribed_calendars_expand" data-toggle="dropdown"
	    aria-haspopup="true" aria-expanded="false">
      <span class="panel-title">
	{% trans %}labels.subscribed_calendars{% endtrans %}
      </span>
      <span class="caret"></span>
  </button>
  <ul class="fa-ul dropdown-menu" aria-labelledby="subscribed_calendars_expand">
  </ul>
  <div class="buttons">
  <i title="{% trans %}labels.subscribe_ical{% endtrans %}" id="calendar_subscribe" class="pseudobutton fa fa-plus"></i>
  </div>
  </div><!-- panel-body -->
  </div><!-- panel -->
  {% endif %}

  <div id="footer">
  {% if footer %}
  <p>{{ footer|raw }}</p>
  {% endif %}
  </div> <!-- footer -->
